services:
  - type: web
    name: transaction-autopilot
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PAYPAL_MODE
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: EMAIL_PROVIDER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        value: onboarding@resend.dev
      - key: MERCHANT_EMAIL
        value: merchant@transaction-autopilot.com
      - key: MERCHANT_PASSWORD
        generateValue: true
      - key: OPERATIONS_SECRET_KEY
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
